[package]
name = "plexus"
description = "The one crate a Plexus activation depends on: the attribute, the types a method's signature names, and the runtime that serves and calls over any channel."
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

[features]
# Off by default: a component (wasm32, no tokio) builds the core alone.
# On: stdio and WebSocket channels, the test-kiln binary, and their tests.
tokio = ["dep:tokio", "dep:tokio-util", "dep:tungstenite"]
# An activation's own SQLite database, `Store`: rusqlite in a process; in a
# component the import plexus:store/sql, answered by the host's one SQLite
# (engine/), so a component that stores needs no C compiler.
store = ["dep:rusqlite", "dep:wit-bindgen"]
# A call stamped at every stage, on both ends, for `benches/trace.rs`.
# Off: none of its code exists.
trace = []
# WebSocket channels over mutually pinned Ed25519 TLS 1.3.
tls = ["tokio", "dep:base64", "dep:rcgen", "dep:rustls", "dep:tokio-rustls", "dep:zeroize"]

[dependencies]
plexus-macros = { path = "../plexus-macros" }
plexus-proto = { path = "../plexus-proto" }
bytes = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await", "executor"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", optional = true, features = ["io-std", "io-util", "net", "process", "rt", "rt-multi-thread"] }
tokio-util = { version = "0.7", optional = true, features = ["codec", "io"] }
tungstenite = { version = "0.30", optional = true }
base64 = { version = "0.22", optional = true }
rcgen = { version = "0.14", optional = true, default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }
zeroize = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.43", optional = true, features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.63", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "net"] }
libtest-mimic = "0.8"

[[bin]]
name = "test-kiln"
path = "src/bin/test-kiln/main.rs"
required-features = ["tokio"]

[[test]]
name = "stdio"
required-features = ["tokio"]

[[test]]
name = "websocket"
required-features = ["tokio"]

[[test]]
name = "tls"
required-features = ["tls"]

[[test]]
name = "store_names"
required-features = ["store"]

[[test]]
name = "page"
harness = false
required-features = ["tokio"]

[[bench]]
name = "pace"
harness = false
required-features = ["tokio"]

[[bench]]
name = "trace"
harness = false
required-features = ["tokio", "trace"]

[[test]]
name = "remote"
required-features = ["tokio"]

[[test]]
name = "store"
required-features = ["store"]

[[example]]
name = "autobahn"
required-features = ["tokio"]

[[example]]
name = "watch-tickets"
required-features = ["tls"]
